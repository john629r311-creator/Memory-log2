name: Build Memory Recall APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -o MemoryRecall-GitHub-Upload-Nov12.zip -d extracted
          cp -a extracted/. .

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Install Android SDK components
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Inspect Android project
        run: |
          echo "CURRENT DIRECTORY:"
          pwd

          echo "PROJECT FILES:"
          find . -maxdepth 5 -type f \
            \( -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
            -o -name "build.gradle" \
            -o -name "build.gradle.kts" \
            -o -name "AndroidManifest.xml" \) \
            -not -path "./.gradle/*" \
            -print

          echo "GRADLE PROJECTS:"
          gradle projects

      - name: Build APK
        run: gradle assembleDebug --stacktrace

      - name: Upload finished APK
        uses: actions/upload-artifact@v4
        with:
          name: MemoryRecall-Keyboard-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
